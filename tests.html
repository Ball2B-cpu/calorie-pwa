function assert(cond, msg) {
  if (!cond) throw new Error(msg || 'assert ล้ม');
}
function deepEqual(a, b) {
  if (a === b) return true;
  if (a == null || b == null) return a === b;
  if (typeof a !== typeof b) return false;
  if (typeof a !== 'object') return false;
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  if (Array.isArray(a)) {
    if (a.length !== b.length) return false;
    return a.every((v, i) => deepEqual(v, b[i]));
  }
  const ak = Object.keys(a), bk = Object.keys(b);
  if (ak.length !== bk.length) return false;
  return ak.every((k) => Object.prototype.hasOwnProperty.call(b, k) && deepEqual(a[k], b[k]));
}
function deepFreeze(o) {
  if (o && typeof o === 'object' && !Object.isFrozen(o)) {
    Object.freeze(o);
    for (const k of Object.getOwnPropertyNames(o)) deepFreeze(o[k]);
  }
  return o;
}
function baseDay(over = {}) {
  return {
    schema: 2,
    date: '1999-01-01',
    rev: 1,
    updatedAt: '2026-09-01T00:00:00+09:00',
    updatedBy: 'claude',
    state: 'draft',
    body: {},
    garmin: null,
    meals: [],
    note: '',
    ai: null,
    review: null,
    totals: {},
    closed: false,
    savedAt: null,
    submitted: false,
    submittedAt: null,
    conflicts: [],
    history: [],
    ...over,
  };
}

const cases = [];
function test(name, fn) { cases.push({ name, fn }); }

test('app เขียน body.weight ได้', () => {
  const remote = baseDay({ body: { fat: 26.2 } });
  const local = baseDay({ body: { weight: 92.7 } });
  deepFreeze(remote); deepFreeze(local);
  const m = db.mergeDay(remote, local, 'app');
  assert(m.body.weight === 92.7, 'weight ต้องเป็นค่าจาก local');
  assert(m.body.fat === 26.2, 'fat ของ remote ต้องไม่หาย');
});

test('meals merge ด้วย id — สลับลำดับ array แล้วข้อมูลไม่สลับกัน', () => {
  const remote = baseDay({
    meals: [

    ],
  });
  const local = baseDay({
    meals: [
      { id: 'm_b', key: 'เย็น', raw: ['B-local'], final: { kcal: 99 } },

  assert(m.meals.length === 2, 'ต้องมี 2 มื้อ');

test('rev = max+1 และ history ต่อเพิ่มขึ้น', () => {
  const remote = baseDay({
    rev: 3,
    history: [{ at: 'T0', by: 'claude', fields: ['migrate'], rev: 1 }],
  });
  const local = baseDay({
    rev: 5,
    body: { weight: 91.2 },
    history: [{ at: 'T0', by: 'claude', fields: ['migrate'], rev: 1 }],
  });
  const before = remote.history.length;
  const m = db.mergeDay(remote, local, 'app');
  assert(m.rev === 6, `rev ต้องเป็น max(3,5)+1=6 ได้ ${m.rev}`);
  assert(m.updatedBy === 'app', 'updatedBy = as');
  assert(m.history.length === before + 1, 'history ต้องเพิ่มขึ้น 1');
  const last = m.history[m.history.length - 1];
  assert(last.by === 'app' && last.rev === 6, 'history ท้ายสุดเป็นรอบนี้');
  assert(Array.isArray(last.fields) && last.fields.includes('body.weight'), 'fields ต้องมี path ที่เปลี่ยน');
  assert(typeof last.at === 'string' && last.at.includes('T'), 'at เป็น ISO');
});

test('ค่าชนกันของเจ้าของเดียวกัน → เข้า conflicts ไม่ถูกทิ้ง และ remote ชนะ', () => {
  const kept = { path: 'note', mine: 'ของฉัน', theirs: 'ของเขา', at: '2026-09-01T07:00:00+09:00' };
  const remote = baseDay({
    rev: 4,
    updatedBy: 'app',
    body: { weight: 90 },
    note: 'ของเขา',
    conflicts: [kept],
    history: [{ at: '2026-09-01T08:00:00+09:00', by: 'app', fields: ['body.weight'], rev: 4 }],
  });
  const local = baseDay({
    rev: 4,
    updatedBy: 'app',
    body: { weight: 92.5 },
    note: 'ของฉัน',
    conflicts: [kept],
    history: [{ at: '2026-09-01T09:00:00+09:00', by: 'app', fields: ['body.weight'], rev: 4 }],
  });
  const m = db.mergeDay(remote, local, 'app');
  assert(m.body.weight === 90, 'remote ต้องชนะ');
  const hit = m.conflicts.find((c) => c.path === 'body.weight');
  assert(hit, 'ต้องมี conflict ของ body.weight');
  assert(hit.mine === 92.5 && hit.theirs === 90, 'mine/theirs ต้องเก็บทั้งสองค่า');
  assert(m.conflicts.some((c) => c.path === 'note' && c.mine === 'ของฉัน'), 'conflict เดิมห้ามถูกทิ้ง');
});

test('ai คำนวณใหม่แล้ว items สั้นลง — ของเก่าที่เกินมาต้องถูกตัดทิ้ง ไม่ค้าง (บั๊ก 22 ก.ย.: จดด่วนเผลอเข้ามื้อผิด ลบออกจาก raw แล้ว est ไม่รวมแต่ items ยังค้าง)', () => {
  // จำลองสถานการณ์จริงจาก days/2026-09-22.json มื้อกลางวัน:
  //  รอบก่อน AI คิดด้วย raw ที่มีข้อความเวย์ปนอยู่ → items มี 2 รายการ (B定食②, เวย์)
  const remote = baseDay({
    meals: [{
      id: 'm_lunch', key: 'กลางวัน', raw: [], photos: ['p_1', 'p_2'],
      items: [
        { name: 'B定食②', est: { kcal: 764, p: 28 } },
        { name: 'เวย์โปรตีน REYS', est: { kcal: 118, p: 21.8 } },
      ],
      est: { kcal: 882, p: 49.8, sig: JSON.stringify([['เวย์...'], ['p_1', 'p_2']]) },
    }],
  });
  // บอลลบข้อความเวย์ออกจาก raw แล้ว (raw กลับไปเป็น [] เหมือนเดิม) แล้วกดคำนวณใหม่
  //  AI คำนวณใหม่จากรูป 2 รูปเท่านั้น → items เหลือรายการเดียว
  const local = baseDay({
    meals: [{
      id: 'm_lunch',
      items: [{ name: 'B定食②', est: { kcal: 764, p: 28 } }],
      est: { kcal: 764, p: 28, sig: JSON.stringify([[], ['p_1', 'p_2']]) },
    }],
  });
  const m = db.mergeDay(remote, local, 'ai');
  const meal = m.meals[0];
  assert(meal.items.length === 1, `items ต้องเหลือรายการเดียว ได้ ${meal.items.length}`);
  assert(meal.items[0].name === 'B定食②', 'ต้องเหลือแค่ B定食②');
  const sum = meal.items.reduce((s, it) => s + (it.est && it.est.kcal || 0), 0);
  assert(sum === meal.est.kcal, `est.kcal (${meal.est.kcal}) ต้องเท่ากับผลรวม items (${sum})`);
});

test('mergeDay ไม่แก้ remote/local ที่รับเข้ามา (pure)', () => {
  const remote = baseDay({ body: { weight: 90, fat: 26 }, meals: [{ id: 'm1', raw: ['a'], final: { kcal: 1 } }] });
  const local = baseDay({ body: { weight: 91 }, meals: [{ id: 'm1', raw: ['b'], final: { kcal: 9 } }] });
  const rSnap = JSON.stringify(remote);
  const lSnap = JSON.stringify(local);
  deepFreeze(remote); deepFreeze(local);
  const m = db.mergeDay(remote, local, 'app');
  assert(JSON.stringify(remote) === rSnap, 'remote ถูกแก้');
  assert(JSON.stringify(local) === lSnap, 'local ถูกแก้');

});

test('putPhoto ปฏิเสธรูปใหญ่ / ด้านยาวเกิน / ไม่ใช่ Blob', async () => {
  await db.open();
  const tiny = new Blob([new Uint8Array(32)], { type: 'image/jpeg' });
  let n = 0;
  try {
    await db.putPhoto({ id: 'p_big_bytes', date: '1999-01-01', blob: tiny, w: 10, h: 10, bytes: 250 * 1024 + 1 });
  } catch (e) {
    assert(/250/.test(String(e.message || e)), 'ข้อความต้องบอก 250 KB');
    n++;
  }
  try {
    await db.putPhoto({ id: 'p_big_side', date: '1999-01-01', blob: tiny, w: 1025, h: 10, bytes: 32 });
  } catch (e) {
    assert(/1024/.test(String(e.message || e)), 'ข้อความต้องบอก 1024');
    n++;
  }
  try {
    await db.putPhoto({ id: 'p_not_blob', date: '1999-01-01', blob: 'nope', w: 10, h: 10, bytes: 4 });
  } catch (e) {
    assert(/Blob|รูป/.test(String(e.message || e)), 'ข้อความต้องบอกว่าไม่ใช่รูป');
    n++;
  }
  assert(n === 3, `ต้องถูกปฏิเสธทั้ง 3 กรณี (ได้ ${n})`);
});

test('outbox: enqueue / failJob เพิ่ม tries คางานไว้ / completeJob ลบ', async () => {
  await db.open();
  let threw = false;
  try { await db.enqueue({ kind: 'nope', date: '1999-01-01' }); } catch { threw = true; }
  assert(threw, 'kind แปลกต้อง throw');

  const id = await db.enqueue({ kind: 'gh-day', date: '1999-01-01' });
  assert(id != null, 'enqueue ต้องได้ id');
  await db.failJob(id, new Error('เน็ตหลุดชั่วคราว'));
  await db.failJob(id, 'timeout');
  const listed = await db.listOutbox();
  const job = listed.find((j) => j.id === id);
  assert(job, 'งานที่ล้มต้องยังอยู่ใน listOutbox');
  assert(job.tries === 2, `tries ต้องเป็น 2 ได้ ${job.tries}`);
  assert(typeof job.lastError === 'string' && job.lastError.includes('timeout'), 'lastError เป็นสตริงเหตุผลล่าสุด');
  const ids = listed.map((j) => j.id);
  const sorted = ids.slice().sort((a, b) => a - b);
  assert(deepEqual(ids, sorted), 'listOutbox เรียงตาม id');
  await db.completeJob(id);
  const after = await db.listOutbox();
  assert(!after.some((j) => j.id === id), 'completeJob ต้องลบงาน');
});

test('export ไม่มี key/token ของบริการภายนอก', async () => {
  await db.open();
  const k1 = localStorage.getItem('cal.or_key');
  const k2 = localStorage.getItem('cal.gh_pat');
  const needleOr = ['sk', 'or', 'TESTKEY'].join('-');
  const needlePat = ['github', 'pat', 'TESTKEY'].join('_');
  const needleGhp = 'ghp' + '_' + 'TESTKEY';
  localStorage.setItem('cal.or_key', needleOr);
  localStorage.setItem('cal.gh_pat', needlePat);
  try {
    const ex = await db.exportAll();
    const s = JSON.stringify(ex);
    assert(ex.app === 'calorie-pwa' && ex.schema === 2, 'โครง export ไม่ครบ');
    assert(Array.isArray(ex.days) && Array.isArray(ex.photos), 'ต้องมี days/photos');
    assert(!s.includes(['sk', 'or', ''].join('-')), 'export มีคีย์ openrouter');
    assert(!s.includes(['github', 'pat', ''].join('_')), 'export มี PAT');
    assert(!s.includes('ghp' + '_'), 'export มี token แบบ ghp');
    assert(!s.includes(needleOr) && !s.includes(needlePat) && !s.includes(needleGhp), 'export ห้ามมีค่าที่เพิ่งใส่ใน localStorage');
    assert(!Object.prototype.hasOwnProperty.call(ex, 'cal.or_key'), 'ห้ามมีคีย์ localStorage');
  } finally {
    if (k1 == null) localStorage.removeItem('cal.or_key'); else localStorage.setItem('cal.or_key', k1);
    if (k2 == null) localStorage.removeItem('cal.gh_pat'); else localStorage.setItem('cal.gh_pat', k2);
  }
});

test('export→import round-trip ได้ข้อมูลเดิมครบ', async () => {
  await db.open();
  const date = '1999-01-02';
  const doc = baseDay({
    date,
    rev: 2,
    body: { weight: 88.8, fat: 25.1 },
    garmin: { burn: 2400, steps: 1000 },
    meals: [{ id: 'm_rt', key: 'เช้า', raw: ['โยเกิร์ต'], items: [{ name: 'โยเกิร์ต', final: { kcal: 70, p: 4 } }], final: { kcal: 70, p: 4 } }],
    note: 'รอบทดสอบ',
    totals: { final: { kcal: 70, p: 4 } },
    closed: true,
  });
  await db.putDay(doc);
  const blob = new Blob([new Uint8Array([1, 2, 3, 4, 5])], { type: 'image/jpeg' });
  await db.putPhoto({ id: 'p_rt_1999', date, mealId: 'm_rt', blob, w: 8, h: 8, bytes: 5 });
  const ex = await db.exportAll();
  const dumped = ex.days.find((d) => d.date === date);
  const dumpedP = ex.photos.find((p) => p.id === 'p_rt_1999');
  assert(dumped && dumped.body.weight === 88.8, 'export ต้องมีวันทดสอบ');
  assert(dumpedP && typeof dumpedP.blobBase64 === 'string' && dumpedP.blobBase64.length > 0, 'รูปต้องเป็น blobBase64');
  assert(!('blob' in dumpedP) || dumpedP.blob == null, 'export รูปห้ามส่ง Blob ดิบ');

  const summary = await db.importAll(JSON.parse(JSON.stringify(ex)));
  assert(summary.days >= 1, 'import ต้องนับวัน');
  const back = await db.getDay(date);
  assert(back.body.weight === 88.8 && back.body.fat === 25.1, 'body ครบ');
  assert(back.garmin && back.garmin.burn === 2400, 'garmin ครบ');
  assert(back.meals[0].raw[0] === 'โยเกิร์ต' && back.meals[0].final.kcal === 70, 'มื้อครบ');
  assert(back.note === 'รอบทดสอบ' && back.closed === true, 'note/closed ครบ');
  const photos = await db.listPhotos(date);
  const p = photos.find((x) => x.id === 'p_rt_1999');
  assert(p && p.blob instanceof Blob, 'รูปต้องกลับมาเป็น Blob');
  assert(p.bytes === 5 && p.w === 8, 'เมตารูปครบ');
});

/* ---- เคส net.js (stub fetch เท่านั้น ห้ามยิงเน็ตจริง) ---- */

function estItem(over = {}) {
  return { name: 'ไข่ไก่', qty: '1 ฟอง', kcal: 75, p: 6, conf: 0.8, basis: 'std', needLabel: false, ...over };
}
function estMeal(over = {}) {
  const items = over.items || [estItem()];
  return {
    items,
    kcal: over.kcal != null ? over.kcal : items.reduce((s, it) => s + Number(it.kcal || 0), 0),
    p: over.p != null ? over.p : items.reduce((s, it) => s + Number(it.p || 0), 0),
    confidence: over.confidence != null ? over.confidence : 0.8,
    warnings: over.warnings || [],
    unclear: over.unclear || [],
  };
}
function jsonRes(obj, status) {
  return new Response(JSON.stringify(obj), { status, headers: { 'Content-Type': 'application/json' } });
}
async function withStubFetch(stub, fn) {
  const orig = globalThis.fetch;
  globalThis.fetch = stub;
  try { return await fn(); }
  finally { globalThis.fetch = orig; }
}
function lsHold(keys) {
  const prev = {};
  for (const k of keys) prev[k] = localStorage.getItem(k);
  return {
    restore() {
      for (const k of keys) {
        if (prev[k] == null) localStorage.removeItem(k);
        else localStorage.setItem(k, prev[k]);
      }
    },
  };
}

test('pushDay เจอ 404 จาก GET แล้วยัง PUT ได้ (ไม่ส่ง sha)', async () => {
  await db.open();

  await db.putDay(baseDay({
    date,
    note: 'ข้าวต้มโอ๊ต ไข่ไก่',

      const method = String((opts && opts.method) || 'GET').toUpperCase();
      if (method === 'GET') {
        gets++;
        return jsonRes({ message: 'Not Found' }, 404);
      }
      if (method === 'PUT') {
        puts.push(JSON.parse(opts.body));
        return jsonRes({ content: { path: 'days/' + date + '.json' }, commit: { sha: 'x' } }, 201);
      }
      throw new Error('fetch ถูกเรียกด้วย method ไม่คาดคิด: ' + method);
    }, async () => {
      await net.pushDay(date);
    });
    assert(gets >= 1, 'ต้อง GET ก่อน PUT');
    assert(puts.length === 1, `ต้อง PUT ครั้งเดียว ได้ ${puts.length}`);
    assert(puts[0].sha == null, 'ไฟล์ใหม่ห้ามส่ง sha');
    assert(puts[0].branch === 'main', 'ต้องระบุ branch main');
    assert(typeof puts[0].content === 'string' && puts[0].content.length > 0, 'ต้องมี content base64');
    const decoded = JSON.parse(net.base64ToUtf8(puts[0].content));
    assert(decoded.note === 'ข้าวต้มโอ๊ต ไข่ไก่', 'content ต้อง encode UTF-8 แล้วมีข้อความไทย');
  } finally {
    hold.restore();
  }
});

test('pushDay เจอ 409 แล้ว retry ไม่เกิน 3 รอบ', async () => {
  await db.open();
  const date = '1999-03-05';
  await db.putDay(baseDay({
    date,
    meals: [{ id: 'm_net409', key: 'เช้า', raw: ['ไข่'] }],
  }));

  localStorage.setItem('cal.gh_pat', 'dummy-pat-not-real-xxxxxx');
  localStorage.setItem('cal.gh_repo', 'owner/cal-test-data');
  const remote = { schema: 2, date, rev: 1, meals: [], totals: {}, history: [], closed: false };
  let gets = 0, puts = 0, calls = 0;
  try {
    await withStubFetch(async (url, opts = {}) => {
      calls++;
      const method = String((opts && opts.method) || 'GET').toUpperCase();
      if (method === 'GET') {
        gets++;
        return jsonRes({
          sha: 'sha-remote-' + gets,
          encoding: 'base64',
          content: net.utf8ToBase64(JSON.stringify(remote)),
        }, 200);
      }
      if (method === 'PUT') {
        puts++;
        return jsonRes({ message: 'Conflict', sha: 'new' }, 409);
      }
      throw new Error('fetch method ไม่คาดคิด: ' + method);
    }, async () => {
      let threw = false;
      try { await net.pushDay(date); } catch (_) { threw = true; }
      assert(threw, 'หลังชน 3 รอบต้องเลิกแล้วคาไว้');
    });
    assert(gets <= 3 && puts <= 3, `รอบ GET/PUT ต้อง ≤ 3 (get ${gets} put ${puts})`);
    assert(calls <= 6, `fetch รวมต้อง ≤ 6 (3 รอบ GET+PUT) ได้ ${calls}`);
    assert(puts === 3 && gets === 3, `ต้องลองครบ 3 รอบ ได้ get ${gets} put ${puts}`);
  } finally {
    hold.restore();
  }
});

test('จดด่วน: เวลา → ดัชนีมื้อ ใช้จุดกึ่งกลางระหว่างมื้อ ไม่ใช่ตัดชั่วโมงเต็ม (บั๊ก 22 ก.ย.: บ่ายก่อน 15:00 ดันเข้ากลางวันแทนของว่าง)', () => {
  const at = (h, m) => ui1a.mealIndexForMinutes(h * 60 + m);

  assert(at(15, 30) === 2, '15:30 ต้องเป็นของว่าง');
  assert(at(17, 14) === 2, '17:14 ยังเป็นของว่าง');
  assert(at(17, 15) === 3, '17:15 (จุดกึ่งกลางของว่าง/เย็น) ต้องข้ามเป็นเย็น');
  assert(at(21, 0) === 3, 'สามทุ่มต้องเป็นเย็น');
});

let passed = 0;
const failures = [];
for (const c of cases) {
  const li = document.createElement('li');
  try {
    await c.fn();
    passed++;
    li.className = 'ok';
    li.textContent = `✅ ${c.name}`;
  } catch (e) {
    failures.push({ name: c.name, err: e });
    li.className = 'fail';
    li.textContent = `❌ ${c.name} — ${e && e.message ? e.message : e}`;
  }
  results.appendChild(li);
}

const total = cases.length;
const line = `ผ่าน ${passed}/${total}`;
summary.textContent = line;
summary.className = passed === total ? 'ok' : 'fail';
document.title = line + ' — ทดสอบ db.js';
document.documentElement.dataset.pass = String(passed);
document.documentElement.dataset.total = String(total);
document.documentElement.dataset.ok = passed === total ? '1' : '0';
if (failures.length) {
  logEl.style.display = 'block';
  logEl.textContent = failures.map((f) => f.name + '\n' + (f.err && f.err.stack ? f.err.stack : f.err)).join('\n\n');
}
</script>
</body>
</html>
